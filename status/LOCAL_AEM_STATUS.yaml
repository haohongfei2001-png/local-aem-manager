  blocker_1:
    id: POST_REFRESH_READINESS_RACE
    deterministic: true
    detail: >
      refresh_thread() reloads with wait_until=domcontentloaded and the harness
      prepares the composer immediately. Live measurement on the certification
      thread: domcontentloaded at +0.64s, composer visible at +2.37s. All three
      probes therefore fail closed as PRE_SEND_FAILED ("composer is not
      visible") and no send is attempted.
  blocker_2:
    id: COMMIT_CONTROL_IS_STOP_WHILE_GENERATING
    deterministic: true
    detail: >
      While a response streams, the single submit control is a stop control
      (data-testid="stop-button", aria-label="停止回答"); both a click and an
      Enter press with text in the composer failed to deliver a user message.
      Because probes 2 and 3 follow the previous probe within ~1-2 seconds,
      their commit cannot be a real send even if blocker 1 were fixed.

