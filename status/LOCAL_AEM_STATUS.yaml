blocker:
  type: OWNER_AUTHORIZATION_REQUIRED
  owner_required: true
  description: >
    The R6 implementation and local certification harness are exact-main CI
    certified, and the live local run was executed against the owner's real
    Chrome/ChatGPT session. The live run cannot pass on the current ChatGPT
    build because of two transport-level defects inside the certified harness:
    (1) a post-refresh readiness race that fails every probe closed as
    PRE_SEND_FAILED, and (2) commit-by-click landing on the stop control while
    the thread is still generating, so probes 2 and 3 cannot perform a real
    send. Fixing them changes the previously certified harness runtime, so it
    needs explicit owner authorization for a new R6 change (PR + CI + a fresh
    live run). No mock or CI result is accepted as a substitute for live
    browser evidence.

